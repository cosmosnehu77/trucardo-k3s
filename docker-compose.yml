# Una compu:     docker compose up --build
# Varias compus: .env con las IPs (ver .env.ejemplo) y en cada una
#                docker compose up --build nodoN
# Jugar:         docker compose run --rm cliente <nombre>
# Telemetria:    OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318 docker compose --profile telemetria up --build
name: trucardo

x-entorno: &entorno
  # sin .env, los nombres de servicio; con .env, las IPs de cada compu
  TRUCARDO_NODOS: "1@${IP_NODO1:-nodo1}:9501:9601,2@${IP_NODO2:-nodo2}:9502:9602,3@${IP_NODO3:-nodo3}:9503:9603"
  PUNTOS: ${PUNTOS:-15}
  LOG_NIVEL: ${LOG_NIVEL:-INFO}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

x-app: &app
  build: .
  image: trucardo:local
  environment: *entorno

x-nodo: &nodo
  <<: *app
  environment:
    <<: *entorno
    TRUCARDO_DATOS: &datos /datos
  restart: "no"     # si lo matan queda muerto hasta docker compose start

x-herramienta: &herramienta
  <<: *app
  profiles: [herramientas]     # no arrancan con up: se usan con run

services:
  nodo1:
    <<: *nodo
    command: ["python", "-m", "nodo.servidor", "1"]
    ports: ["9501:9501", "9601:9601"]
    volumes:
      - type: volume
        source: datos1
        target: *datos

  nodo2:
    <<: *nodo
    command: ["python", "-m", "nodo.servidor", "2"]
    ports: ["9502:9502", "9602:9602"]
    volumes:
      - type: volume
        source: datos2
        target: *datos

  nodo3:
    <<: *nodo
    command: ["python", "-m", "nodo.servidor", "3"]
    ports: ["9503:9503", "9603:9603"]
    volumes:
      - type: volume
        source: datos3
        target: *datos

  cliente:
    <<: *herramienta
    entrypoint: ["python", "-m", "cliente.cliente"]
    stdin_open: true
    tty: true

  quien_es:
    <<: *herramienta
    entrypoint: ["python", "-m", "cliente.quien_es"]

  historial:
    <<: *herramienta
    entrypoint: ["python", "-m", "cliente.historial"]

  tests:
    <<: *herramienta
    entrypoint: ["python", "run_tests.py"]

  demo:
    <<: *herramienta
    entrypoint: ["python", "demo.py"]

  collector:
    image: otel/opentelemetry-collector:0.165.0
    profiles: [telemetria]
    command: ["--config=/etc/otelcol/collector.json"]
    volumes: ["./despliegue/observabilidad/collector.json:/etc/otelcol/collector.json:ro"]
    ports: ["4318:4318"]

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    profiles: [telemetria]
    ports: ["16686:16686"]

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [telemetria]
    command: ["--config.file=/etc/prometheus/prometheus.json", "--web.enable-otlp-receiver"]
    volumes: ["./despliegue/observabilidad/prometheus.json:/etc/prometheus/prometheus.json:ro"]
    ports: ["9090:9090"]

  loki:
    image: grafana/loki:3.6.22
    profiles: [telemetria]

  grafana:
    image: grafana/grafana:13.3.2
    profiles: [telemetria]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./despliegue/observabilidad/fuentes.yaml:/etc/grafana/provisioning/datasources/fuentes.yaml:ro
      - ./despliegue/observabilidad/tableros.yaml:/etc/grafana/provisioning/dashboards/tableros.yaml:ro
      - ./despliegue/observabilidad/tablero-trucardo.json:/etc/grafana/tableros/tablero-trucardo.json:ro
    ports: ["3000:3000"]

volumes:
  datos1: {}
  datos2: {}
  datos3: {}
